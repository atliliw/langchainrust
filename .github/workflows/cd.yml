# CD workflow
# Publish to crates.io when a new tag (v*) is created

name: CD - Publish to crates.io

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== Pre-publish checks ====================
  pre-publish:
    name: Pre-publish Checks
    runs-on: ubuntu-latest
    env:
      # Overrides the repo's rust-toolchain.toml 1.85 pin (which takes precedence
      # over the stable toolchain installed by the dtolnay action).
      # cargo-semver-checks 0.50 has MSRV 1.93, so `cargo install` from source
      # fails on 1.85 — keep this consistent with ci.yml's semver job.
      RUSTUP_TOOLCHAIN: stable
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 0.20.0 S2.2: scripted release gate. The former manual fmt/clippy/test/doc
      # steps are now `scripts/release-gate.sh --all-features` (disk preflight,
      # semver-checks baseline, security-scan, whole-workspace version consistency).
      # Things this workflow still does outside the script:
      # 2026-11-14: layered gate — fmt/clippy are soft (WARN only, non-blocking);
      # test/rustdoc/semver/security/version consistency remain hard gates.
      # Set STRICT_LINT=1 to restore strict mode.
      #   1) tag version vs facade crate version — release-gate step 8 only checks
      #      crates against each other, not against the tag.
      #   2) installing cargo-semver-checks — release-gate step 6 really runs it in
      #      CI mode (the script only warns/skips when it is missing locally).
      #   3) resolving the semver baseline from crates.io dynamically (see the
      #      Resolve step below) — before 0.22.5, BASELINE was hardcoded to 0.19.0
      #      and went stale across releases.
      # Note: the root Cargo.toml is a virtual workspace with no version field;
      # the release version is the facade crate's version
      # (crates/lc/Cargo.toml, package = "langchainrust").
      # (The old approach grepped the root Cargo.toml, got an empty value, and the
      # tag check always failed — fixed in 0.20.0.)
      - name: Verify tag vs facade version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' crates/lc/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Tag version: $TAG_VERSION"
          echo "Facade Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != facade version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Tag version consistency check passed"

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # Resolve the semver baseline dynamically from the latest stable release of
      # the facade crate (langchainrust) on crates.io. No hardcoding (0.19.0 went
      # stale across several releases). The publish job has not run yet, so the
      # new version is not uploaded and the latest entry is necessarily the
      # previous release.
      - name: Resolve semver baseline from crates.io
        id: baseline
        run: |
          BASELINE=$(curl -fsS https://index.crates.io/la/ng/langchainrust | python3 -c 'import json,sys; rows=[json.loads(l) for l in sys.stdin if l.strip()]; v=[r["vers"] for r in rows if not r.get("yanked") and "-" not in r["vers"]]; print(v[-1] if v else "")')
          if [ -z "$BASELINE" ]; then
            echo "ERROR: could not resolve the semver baseline from crates.io" >&2
            exit 1
          fi
          echo "semver baseline (previous release) = $BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_OUTPUT"

      - name: Run release gate
        run: bash scripts/release-gate.sh --all-features
        env:
          OPENAI_API_KEY: test-key
          # semver baseline = latest stable on crates.io (resolved above; no manual edit per release)
          BASELINE: ${{ steps.baseline.outputs.BASELINE }}
          # CI runner disk is limited; lower the warning threshold (this step only warns)
          MIN_FREE_GB: "2"

  # ==================== Publish to crates.io ====================
  publish:
    name: Publish to crates.io
    needs: pre-publish
    runs-on: ubuntu-latest
    env:
      # Same as pre-publish: override the 1.85 pin so cargo publish's verify build
      # runs on stable (some gated deps require MSRV above 1.85).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # A virtual-workspace root cannot be published directly with cargo publish;
      # the script publishes all 23 crates in cargo-metadata topological order
      # (already-published versions are skipped, so it is resumable).
      # The token is injected via an environment variable (cargo publish reads it
      # by default), never as a command-line argument.
      - name: Publish workspace crates in dependency order
        run: bash scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ==================== Create GitHub Release ====================
  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${{ steps.get_version.outputs.version }}"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog for initial release"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Save to a file (multi-line content)
          echo "$CHANGELOG" > CHANGELOG.txt

          # Build the release body
          cat << EOF > release_body.md
          ## What's Changed

          $CHANGELOG

          ## Installation

          Add this to your \`Cargo.toml\`:

          \`\`\`toml
          [dependencies]
          langchainrust = "${{ steps.get_version.outputs.version }}"
          \`\`\`

          ## Documentation

          - [API Documentation](https://docs.rs/langchainrust/${{ steps.get_version.outputs.version }})
          - [Examples](https://github.com/atliliw/langchainrust/tree/main/examples)
          - [Usage Guide](https://github.com/atliliw/langchainrust/blob/main/docs/USAGE.md)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Post-publish docs.rs check (T1, v0.23) ====================
  # docs.rs had been failing since 0.20 without anyone noticing. After publishing,
  # poll the builds page until a succeeded/failed marker appears; a failure makes
  # this job red. The docs.rs queue can take minutes to ~15 minutes: 30-minute
  # timeout, one poll every 20s. Only the HTML page is available (builds.json is
  # 404); the status row looks like `(succeeded|failed)"><div ...><span class="fa ...
  # fa-check|fa-xmark`.
  verify-docs-rs:
    name: Verify docs.rs Build
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Poll docs.rs build result
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag has a v prefix (v0.23.0); docs.rs paths use the bare version (0.23.0)
          VERSION="${TAG#v}"
          NAME=langchainrust
          URL="https://docs.rs/crate/$NAME/$VERSION/builds"
          echo "Polling $URL ..."
          for i in $(seq 1 90); do
            HTML=$(curl -fsSL "$URL" 2>/dev/null || true)
            if [ -n "$HTML" ]; then
              # The builds page has one row per build; the class is the terminal
              # state: `succeeded"><div class=...` or `failed"><div class=...`
              # (icons fa-check / fa-xmark, but we do not rely on the icon; the
              # builds.json API is retired and only HTML is available). The first
              # row is the most recent build.
              ROW=$(printf '%s' "$HTML" | grep -oE '(succeeded|failed)"><div class="pure-g"' | head -1 | sed 's/">.*//')
              case "$ROW" in
                succeeded)
                  echo "✅ docs.rs build for $NAME $VERSION succeeded"
                  echo "### ✅ docs.rs build succeeded" >> "$GITHUB_STEP_SUMMARY"
                  echo "https://docs.rs/$NAME/$VERSION" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                failed)
                  echo "::error::docs.rs build FAILED for $NAME $VERSION — see $URL"
                  echo "### ❌ docs.rs build failed" >> "$GITHUB_STEP_SUMMARY"
                  echo "Build log: $URL" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            fi
            echo "  ($i) no terminal build status yet, retrying in 20s"
            sleep 20
          done
          echo "::error::docs.rs build for $NAME $VERSION did not finish within 30 minutes"
          exit 1

  # ==================== Release notification ====================
  notify:
    name: Notify on Success
    # Only announce success after the docs.rs check passes (it may queue for ~15 min; worth waiting)
    needs: [publish, create-release, verify-docs-rs]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create success summary
        run: |
          echo "## ✅ Release Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [crates.io](https://crates.io/crates/langchainrust)" >> $GITHUB_STEP_SUMMARY
          echo "- [docs.rs](https://docs.rs/langchainrust/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/atliliw/langchainrust/releases/tag/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY

# CD 工作流
# 当创建新的 tag (v*) 时自动发布到 crates.io

name: CD - Publish to crates.io

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== 预发布检查 ====================
  pre-publish:
    name: Pre-publish Checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # 0.20.0 S2.2:发布门禁脚本化。原本的 fmt/clippy/test/doc 手工步骤固化为
      # `scripts/release-gate.sh --all-features`(含磁盘预检、semver-checks 基线、
      # security-scan、全 workspace 版本一致性)。这里保留两件脚本不做的事:
      #   1) tag 版本 vs facade crate 版本一致性——release-gate 第 8 步只查各
      #      crate 相互一致,不对比 tag。
      #   2) 安装 cargo-semver-checks——release-gate 第 6 步在 CI 模式要真实
      #      运行(本地未装时脚本才 warn+跳过)。
      # 注意:根 Cargo.toml 是虚拟 workspace,无 version 字段;发布版本以
      # facade crate(crates/lc/Cargo.toml,package = "langchainrust")为准。
      # (旧写法 grep 根 Cargo.toml 得到空值,tag 检查必然失败——0.20.0 修正。)
      - name: Verify tag vs facade version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' crates/lc/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "Tag version: $TAG_VERSION"
          echo "Facade Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) != facade version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Tag version consistency check passed"

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: Run release gate
        run: bash scripts/release-gate.sh --all-features
        env:
          OPENAI_API_KEY: test-key
          # semver 基线 = 上一发布版本;每次发版前更新
          BASELINE: "0.19.0"
          # CI runner 磁盘有限,降低告警阈值(该步只 warn 不 fail)
          MIN_FREE_GB: "2"

  # ==================== 发布到 crates.io ====================
  publish:
    name: Publish to crates.io
    needs: pre-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ==================== 创建 GitHub Release ====================
  create-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to ${{ steps.get_version.outputs.version }}"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog for initial release"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          
          # 保存到文件（多行内容）
          echo "$CHANGELOG" > CHANGELOG.txt
          
          # 创建 release body
          cat << EOF > release_body.md
          ## What's Changed
          
          $CHANGELOG
          
          ## Installation
          
          Add this to your \`Cargo.toml\`:
          
          \`\`\`toml
          [dependencies]
          langchainrust = "${{ steps.get_version.outputs.version }}"
          \`\`\`
          
          ## Documentation
          
          - [API Documentation](https://docs.rs/langchainrust/${{ steps.get_version.outputs.version }})
          - [Examples](https://github.com/atliliw/langchainrust/tree/main/examples)
          - [Usage Guide](https://github.com/atliliw/langchainrust/blob/main/docs/USAGE.md)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== 发布通知 ====================
  notify:
    name: Notify on Success
    needs: [publish, create-release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Get version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create success summary
        run: |
          echo "## ✅ Release Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- [crates.io](https://crates.io/crates/langchainrust)" >> $GITHUB_STEP_SUMMARY
          echo "- [docs.rs](https://docs.rs/langchainrust/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/atliliw/langchainrust/releases/tag/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
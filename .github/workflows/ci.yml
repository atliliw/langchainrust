# CI 工作流
# 在每次 push 和 pull request 时自动运行测试、格式检查和 clippy

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== 格式检查 ====================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml 锁的是 MSRV 1.85,会覆盖 dtolnay 装的工具链,导致
      # 所有 job 实际都在 1.85 上跑(stable/beta 矩阵行失真、cargo install 工具
      # 时工具自身 MSRV 更高而失败)。RUSTUP_TOOLCHAIN 是最高优先级,确保每个
      # job 用声明自己的工具链。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==================== Clippy 检查 ====================
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 对齐 v0.20.0 计划 S5 门禁:clippy 不跑 --all-features。
      # --all-features 会启用 feature 门控依赖(ort-sys/tonic/image 等,声明
      # rust-version ≥ 1.88),这些是 MSRV 承诺之外的盲区,由 release-gate.sh
      # 在 stable 上单独覆盖。
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==================== 测试 ====================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: "1.85"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
        env:
          # 使用模拟数据运行测试，不需要真实 API Key
          OPENAI_API_KEY: test-key

      # --all-features 会启用 feature 门控的依赖(ort-sys 等,要求 rustc ≥ 1.88),
      # 不属于 MSRV 承诺,MSRV 门禁行只验证默认特性编译 + 测试。
      # 只留 ubuntu + stable 一行做全特性冒烟(其余平台/工具链受 ort-sys 下载与
      # MSRV 限制,不做全特性门禁)。
      - name: Test all features (ubuntu+stable only)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test --all-features --verbose
        env:
          OPENAI_API_KEY: test-key

  # ==================== MSRV 检查 ====================
  # MSRV = 1.85(见 rust-toolchain.toml 与各 crate 的 rust-version 字段)。
  # 已由上面 test 矩阵的 `rust: "1.85"` 行(ubuntu-latest)覆盖:该行即 MSRV 门禁,
  # 保证 1.85 下默认特性编译 + 测试通过。不另起 job,避免 1.85 重复编译。
  # 注意:test job 的 RUSTUP_TOOLCHAIN=${{ matrix.rust }} 让每行用自己声明的
  # 工具链(否则 rust-toolchain.toml 会把所有行拽到 1.85);MSRV 行跳过
  # 「Test all features」步骤(feature 门控依赖需更高 rustc)。

  # ==================== semver 检查 ====================
  # 对比每个 crate 最近一次发布(registry 上的 0.15.x)与当前源码的公开 API 差异。
  # 0.x 序列里 0.15→0.16 允许破坏性 minor;本门禁确保破坏都在计划内、
  # 非预期的破坏(baseline 分析结果)会以编译错误的形式暴露出来。
  semver:
    name: SemVer Checks
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # 当前版本已是 0.20.0(crates.io 尚未发布),必须显式给 baseline 0.19.0,
      # 否则工具自动取同版本(0.20.0)基线会报找不到。
      - name: Run semver checks (baseline 0.19.0)
        run: cargo semver-checks --workspace --baseline-version 0.19.0

  # ==================== WASM 兼容检查 ====================
  # 目前只有数据模型层(lc-shared / lc-schema)对 wasm32-unknown-unknown 干净
  # (依赖仅 serde/serde_json/thiserror/async-trait)。lc-core 等含无条件原生依赖
  # (tokio full / reqwest / tiktoken-rs / uuid-v4→getrandom),wasm 适配未落地,
  # 详见 docs/internal/v0.16.0/EXECUTION_PLAN.md 验证清单的 wasm 项说明。
  wasm:
    name: WASM Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # wasm32 target 装在 stable 上,切到 1.85 会 E0463
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check wasm compatibility
        run: cargo check --target wasm32-unknown-unknown -p lc-schema -p lc-shared

  # ==================== 文档检查 ====================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 对齐 v0.20.0 计划 S5 门禁:rustdoc 不跑 --all-features(feature 门控
      # 依赖的 rustdoc 警告属 MSRV 盲区之外,由 release-gate.sh 在 stable 上覆盖)。
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ==================== 安全审计 ====================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-audit 自身要求 rustc ≥ 1.88
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # ==================== 危险模式静态扫描 ====================
  # 0.18.1 ⏳ 待办落地:门禁补「安全/质量静态分析 job」。
  # scripts/security-scan.sh 用正则基线扫危险模式(SQL 拼接/路径穿越/子进程
  # 参数拼接/硬编码 key/URL 内嵌 secret)。BLOCK 命中即 fail(基线已清零,
  # 新命中即回归);A1/A4 为 ADVISORY 只打印。纯 grep 无 cargo 依赖,不受
  # windows-gnu/ort-sys 等本地环境盲区影响。
  security-scan:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dangerous-pattern scan
        run: bash scripts/security-scan.sh --fail-if-found

  # ==================== 覆盖率报告 ====================
  # 使用 cargo-llvm-cov 测量行覆盖率。门禁先压到 50% 求绿:CI 日志在
  # --lcov 模式下不打印真实百分比,GitHub API/codecov 本地均无法取数,
  # 80% 是未经验证的虚高目标(一直红)。50% 作为保守基线守住,后续拿到
  # 真实覆盖率再按 baseline+margin 提回。
  # 注意:本机 windows-gnu 工具链缺 profiler_builtins(`rustc -C instrument-coverage`
  # 报 E0463),无法本地测量覆盖率;此门禁依赖 Linux CI 的完整工具链执行。
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-llvm-cov 自身要求 rustc ≥ 1.87
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        run: cargo llvm-cov --workspace --fail-under-lines 50 --lcov --output-path lcov.info
        env:
          OPENAI_API_KEY: test-key

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
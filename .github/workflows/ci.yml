# CI workflow
# Runs tests, formatting, and clippy on every push and pull request

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== Format check ====================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pins MSRV 1.85 and would override the toolchain that
      # dtolnay installs, dragging every job onto 1.85 (distorting the stable/beta
      # matrix rows and failing `cargo install` when a tool itself needs a higher
      # MSRV). RUSTUP_TOOLCHAIN has the highest precedence, so each job uses the
      # toolchain it declares.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==================== Clippy check ====================
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"  # clippy follows the MSRV gate; see the comment on the clippy step below
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (1.85)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # clippy runs on the MSRV toolchain (1.85), consistent with the test
      # matrix's MSRV row and the repo's MSRV commitment.
      # Stable clippy (1.86+) exposes lints that 1.85 developers cannot see
      # (e.g. collapsible-match), causing a push -> CI red -> fix -> push
      # whack-a-mole; and the local stable toolchain is windows-gnu while the
      # repo builds msvc, so stable clippy cannot be previewed locally.
      # Clippy 1.85 was verified locally: the whole workspace is zero-lint under
      # --all-targets -D warnings (2026-08-29).
      # `--all-features` is not run here: feature-gated deps (ort-sys/tonic etc.,
      # rust-version >= 1.88) are outside the MSRV promise and covered by the
      # clippy-all-features job below on stable.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==================== Clippy (all features, stable) ====================
  # Aligned with cd.yml's release-gate.sh --all-features: lint and compile
  # regressions in feature-gated code (ort-sys/tonic/fastembed etc., rustc >= 1.88,
  # unbuildable on MSRV 1.85) surface on every push instead of blowing up on tag day.
  # 0.22.4 incident: fastembed's all-features compile error was only found after release.
  clippy-all-features:
    name: Clippy Lints (all features)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-allfeat-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-allfeat-cargo-

      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ==================== Feature matrix (cargo-hack) ====================
  # T1 (v0.23): per-feature idempotency matrix. A compile error in a single
  # feature (outside --all-features and outside default clippy features) is
  # exposed as soon as that one combination breaks, instead of hiding inside
  # --all-features. 0.22.4's fastembed E0308 / local-embeddings E0195 were exactly
  # this tier (single-feature compile errors merged into --all-features).
  #   - `--each-feature` covers every crate that actually gates features:
  #     lc-embeddings (fastembed/local-candle/local-embeddings),
  #     lc-vector-stores (qdrant/mongodb/redis/sqlite/pgvector),
  #     lc-langgraph (4 checkpoint backends), lc-memory, lc-observability,
  #     lc-callbacks, lc-tools, lc-a2a (axum), lc-agents (sse-server). Measured:
  #     lc-providers has no features (providers are not feature-gated) and is
  #     excluded. Any single feature failing `cargo check` turns this job red.
  #   - the facade (langchainrust) runs `--feature-powerset --depth 2`: compile
  #     regressions of feature pairs. Heavy ML features (fastembed/local-candle/
  #     local-embeddings) are excluded — their single features are already covered
  #     by lc-embeddings' each-feature, and pulling in ort/candle would slow the
  #     powerset; the remaining combinations (storage/checkpoint/observability
  #     etc.) are checked one at a time.
  #   - `--no-dev-deps`: only verifies that feature-gated code itself compiles,
  #     without re-building dev-deps.
  #   - cargo-hack and the feature-gated deps all run on stable; the local
  #     windows-gnu toolchain is a blind spot for ort-sys (lc-embeddings cannot be
  #     previewed locally), so this verification lives in Linux CI (aligned with
  #     docs.rs); the other 8 crates' 43 combinations have all passed locally on
  #     windows-gnu.
  feature-matrix:
    name: Feature Matrix (cargo-hack)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-featmatrix-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-featmatrix-cargo-

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Check every feature of feature-gated crates
        run: |
          # lc-embeddings is only verifiable on Linux (ort-sys has no windows-gnu prebuilt binary).
          cargo hack check --package lc-embeddings --each-feature --no-dev-deps
          cargo hack check --package lc-vector-stores --each-feature --no-dev-deps
          cargo hack check --package lc-langgraph --each-feature --no-dev-deps
          cargo hack check --package lc-memory --each-feature --no-dev-deps
          cargo hack check --package lc-observability --each-feature --no-dev-deps
          cargo hack check --package lc-callbacks --each-feature --no-dev-deps
          cargo hack check --package lc-tools --each-feature --no-dev-deps
          cargo hack check --package lc-a2a --each-feature --no-dev-deps
          cargo hack check --package lc-agents --each-feature --no-dev-deps

      - name: Check facade feature powerset (depth 2, excluding heavy ML features)
        run: |
          cargo hack check --package langchainrust --feature-powerset --depth 2 \
            --exclude-features fastembed,local-candle,local-embeddings --no-dev-deps

  # ==================== Tests ====================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: "1.85"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
        env:
          # Run tests against mocked data; no real API key required
          OPENAI_API_KEY: test-key

      # --all-features enables feature-gated deps (ort-sys etc., requiring
      # rustc >= 1.88), outside the MSRV promise; the MSRV gate row only verifies
      # default-feature compilation + tests.
      # Only the ubuntu + stable row does the all-features smoke test (other
      # platforms/toolchains are limited by ort-sys downloads and MSRV, so there
      # is no all-features gate for them).
      - name: Test all features (ubuntu+stable only)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test --all-features --verbose
        env:
          OPENAI_API_KEY: test-key

  # ==================== MSRV check ====================
  # MSRV = 1.85 (see rust-toolchain.toml and each crate's rust-version field).
  # This is covered by the test matrix's `rust: "1.85"` row (ubuntu-latest):
  # that row IS the MSRV gate, guaranteeing default-feature compilation + tests
  # pass on 1.85. No separate job, to avoid compiling 1.85 twice.
  # Note: the test job's RUSTUP_TOOLCHAIN=${{ matrix.rust }} makes each row use
  # its declared toolchain (otherwise rust-toolchain.toml drags every row onto
  # 1.85); the MSRV row skips the "Test all features" step (feature-gated deps
  # need a newer rustc).

  # ==================== SemVer checks ====================
  # Compares each crate's public API against the latest stable version on
  # crates.io (resolved dynamically = the previous release). In the 0.x series,
  # minor bumps allow breaking changes; this gate ensures breakage happens as
  # planned, and unexpected breakage (baseline analysis results) surfaces as
  # compile errors.
  semver:
    name: SemVer Checks
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # The baseline is resolved dynamically from crates.io's latest stable facade
      # crate (langchainrust) = the previous release (hardcoded to 0.19.0 before
      # 0.22.5, which drifted across releases and kept this job red).
      # After a release, the same-version baseline diff passes automatically; on
      # pre-release pushes, this compares against the previous release's API.
      - name: Resolve semver baseline from crates.io
        id: baseline
        run: |
          BASELINE=$(curl -fsS https://index.crates.io/la/ng/langchainrust | python3 -c 'import json,sys; rows=[json.loads(l) for l in sys.stdin if l.strip()]; v=[r["vers"] for r in rows if not r.get("yanked") and "-" not in r["vers"]]; print(v[-1] if v else "")')
          if [ -z "$BASELINE" ]; then
            echo "ERROR: could not resolve the semver baseline from crates.io" >&2
            exit 1
          fi
          echo "semver baseline (previous release) = $BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_OUTPUT"

      # The facade (langchainrust) cannot run baseline rustdoc together with the
      # workspace under --all-features: the published 0.23.0 manifest declares
      # lc-vector-stores' pgvector ^0.4, lockless resolution picks up 0.4.2 (whose
      # sqlx requirement was relaxed to <0.10) + sqlx 0.9, splitting into two
      # sqlx-core versions and failing the baseline rustdoc six times with E0277 —
      # a published artifact can never be fixed (fixed in 32b3c0a).
      # Member crates follow the workspace graph (unified by Cargo.lock) and are
      # unaffected; the facade is checked separately against the docs.rs explicit
      # feature list (which already excludes pgvector-storage, matching the docs.rs
      # build surface).
      - name: Run semver checks (workspace members)
        run: cargo semver-checks --workspace --exclude langchainrust --baseline-version ${{ steps.baseline.outputs.BASELINE }}

      - name: Run semver checks (facade with docs.rs feature set)
        run: |
          cargo semver-checks -p langchainrust \
            --baseline-version ${{ steps.baseline.outputs.BASELINE }} \
            --only-explicit-features \
            --features experimental,qdrant-integration,mongodb-persistence,redis-storage,sqlite-storage,checkpoint-sqlite,checkpoint-postgres,checkpoint-redis,opentelemetry,local-embeddings,fastembed,vectorstore-memory,observability,observability-mongodb,browser-cdp

  # ==================== WASM compatibility ====================
  # Only the data-model layer (lc-shared / lc-schema) is clean for
  # wasm32-unknown-unknown today (deps are only serde/serde_json/thiserror/
  # async-trait). lc-core et al. carry unconditional native deps (tokio full /
  # reqwest / tiktoken-rs / uuid-v4->getrandom), so wasm support is not landed yet;
  # see the wasm checklist in docs/internal/v0.16.0/EXECUTION_PLAN.md.
  wasm:
    name: WASM Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # wasm32 target is installed on stable; switching to 1.85 gives E0463
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check wasm compatibility
        run: cargo check --target wasm32-unknown-unknown -p lc-schema -p lc-shared

  # ==================== Documentation checks ====================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Default-feature rustdoc (feature-gated deps outside the MSRV blind spot
      # are not included).
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # All-features rustdoc: aligned with cd.yml's release-gate.sh --all-features,
      # so every push catches docs for feature-gated APIs (0.22.5 fixed fastembed's
      # all-features rustdoc E0308).
      - name: Build documentation (all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ==================== Security audit ====================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-audit itself requires rustc >= 1.88
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # ==================== Dangerous-pattern static scan ====================
  # 0.18.1 (implemented): a security/quality static-analysis job in the gate.
  # scripts/security-scan.sh scans for dangerous patterns with a regex baseline
  # (SQL concatenation / path traversal / subprocess argument concatenation /
  # hardcoded keys / secrets embedded in URLs). A BLOCK hit fails the job
  # (the baseline is zero, so any new hit is a regression); A1/A4 hits are
  # ADVISORY and only printed. Pure grep with no cargo dependency — immune to
  # local blind spots such as windows-gnu / ort-sys.
  security-scan:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dangerous-pattern scan
        run: bash scripts/security-scan.sh --fail-if-found

  # ==================== Code coverage report ====================
  # Measures line coverage with cargo-llvm-cov. The gate is held at 50% to stay
  # green: in --lcov mode the CI log does not print the real percentage, and
  # neither the GitHub API nor codecov locally can read it, so 80% is an
  # unverified aspiration (it kept us red). 50% is the conservative baseline;
  # once real coverage is measurable again, raise it back with baseline+margin.
  # Note: the local windows-gnu toolchain lacks profiler_builtins (`rustc
  # -C instrument-coverage` gives E0463), so coverage cannot be measured locally;
  # this gate relies on the full Linux CI toolchain.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-llvm-cov itself requires rustc >= 1.87
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Pre-build stdio interop fixtures
        # cargo-llvm-cov runs tests with `--tests` using its own target dir, which
        # does not build examples; lc-mcp/tests/stdio_interop.rs expects binaries
        # under target/debug/examples, and all 10 cases panic when they are missing.
        run: cargo build -p lc-mcp --examples

      - name: Generate coverage
        run: cargo llvm-cov --workspace --fail-under-lines 50 --lcov --output-path lcov.info
        env:
          OPENAI_API_KEY: test-key

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  examples:
    name: Examples
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-examples-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-examples-cargo-

      - name: Check examples (default features)
        run: cargo check -p langchainrust --examples

      - name: Check examples (openai-server)
        run: cargo check -p langchainrust --examples --features openai-server
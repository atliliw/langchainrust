# CI 工作流
# 在每次 push 和 pull request 时自动运行测试、格式检查和 clippy

name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== 格式检查 ====================
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml 锁的是 MSRV 1.85,会覆盖 dtolnay 装的工具链,导致
      # 所有 job 实际都在 1.85 上跑(stable/beta 矩阵行失真、cargo install 工具
      # 时工具自身 MSRV 更高而失败)。RUSTUP_TOOLCHAIN 是最高优先级,确保每个
      # job 用声明自己的工具链。
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==================== Clippy 检查 ====================
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"  # clippy 跟随 MSRV 门禁,理由见下方 Run clippy 注释
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (1.85)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # clippy 跑 MSRV 工具链(1.85),与 test 矩阵 MSRV 行、仓库 MSRV 承诺一致。
      # stable clippy(1.86+)会暴露 1.85 开发者看不见的新 lint(如
      # collapsible-match),造成「push→CI 红→改→再 push」打地鼠;且本机 stable
      # 工具链为 windows-gnu、仓库构建目标是 msvc,无法在本地预演 stable clippy。
      # 1.85 clippy 已本地验证全 workspace --all-targets -D warnings 零 lint
      # (2026-08-29)。
      # 不跑 --all-features:feature 门控依赖(ort-sys/tonic 等,rust-version ≥ 1.88)
      # 属 MSRV 承诺之外盲区,由下方 clippy-all-features job 在 stable 上覆盖。
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==================== 全特性 Clippy(stable)====================
  # 与 cd.yml 的 release-gate.sh --all-features 对齐:feature 门控代码
  # (ort-sys/tonic/fastembed 等,rustc ≥ 1.88,MSRV 1.85 编不了)的 lint 与
  # 编译回归在「每次 push」暴露,而不是等到发 tag 当天才炸。
  # 0.22.4 事故:fastembed 的 all-features 编译错只在发布后才被发现。
  clippy-all-features:
    name: Clippy Lints (all features)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-allfeat-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-allfeat-cargo-

      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ==================== 特性组合矩阵(cargo-hack)====================
  # T1 (v0.23):feature 幂矩阵。单个 feature 的编译错(all-features 之外、clippy
  # 默认特性之外)在「单 feature 组合坏掉」时逐个暴露,而不是躲进 all-features
  # 一起炸。0.22.4 的 fastembed E0308 / local-embeddings E0195 正是这一档(单
  # feature 编译错,但被合并到 all-features 里)。
  #   - `--each-feature` 覆盖所有真有 feature 门控的 crate:lc-embeddings
  #     (fastembed/local-candle/local-embeddings)、lc-vector-stores(qdrant/
  #     mongodb/redis/sqlite/pgvector)、lc-langgraph(4 个 checkpoint 后端)、
  #     lc-memory、lc-observability、lc-callbacks、lc-tools、lc-a2a(axum)、
  #     lc-agents(sse-server)。实测 lc-providers 无任何 feature(provider 不靠
  #     feature 门控),不纳入。任一个 feature 单独 `cargo check` 失败 → 本 job 红。
  #   - facade(langchainrust)跑 `--feature-powerset --depth 2`:两两组合的编译
  #     回归。排掉重 ML feature(fastembed/local-candle/local-embeddings)——它们
  #     的单 feature 已由上面 lc-embeddings 的 each-feature 覆盖,且拉入 ort/candle
  #     拖慢 powerset;其余组合(存储/checkpoint/observability 等)逐一 check。
  #   - `--no-dev-deps`:仅验证 feature 门控代码本身能否编译,不重复编 dev-deps。
  #   - cargo-hack 与 feature 门控依赖都在 stable;本机 windows-gnu 对 ort-sys
  #     是盲区(lc-embeddings 一组本地无法预演),此验证责任在 Linux CI(与 docs.rs
  #     对齐);其余 8 crate 共 43 个组合已在 windows-gnu 本地全绿。
  feature-matrix:
    name: Feature Matrix (cargo-hack)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-featmatrix-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-featmatrix-cargo-

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Check every feature of feature-gated crates
        run: |
          # lc-embeddings 仅在 Linux 可验(ort-sys 无 windows-gnu 预编译)。
          cargo hack check --package lc-embeddings --each-feature --no-dev-deps
          cargo hack check --package lc-vector-stores --each-feature --no-dev-deps
          cargo hack check --package lc-langgraph --each-feature --no-dev-deps
          cargo hack check --package lc-memory --each-feature --no-dev-deps
          cargo hack check --package lc-observability --each-feature --no-dev-deps
          cargo hack check --package lc-callbacks --each-feature --no-dev-deps
          cargo hack check --package lc-tools --each-feature --no-dev-deps
          cargo hack check --package lc-a2a --each-feature --no-dev-deps
          cargo hack check --package lc-agents --each-feature --no-dev-deps

      - name: Check facade feature powerset (depth 2, excluding heavy ML features)
        run: |
          cargo hack check --package langchainrust --feature-powerset --depth 2 \
            --exclude-features fastembed,local-candle,local-embeddings --no-dev-deps

  # ==================== 测试 ====================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: "1.85"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
        env:
          # 使用模拟数据运行测试，不需要真实 API Key
          OPENAI_API_KEY: test-key

      # --all-features 会启用 feature 门控的依赖(ort-sys 等,要求 rustc ≥ 1.88),
      # 不属于 MSRV 承诺,MSRV 门禁行只验证默认特性编译 + 测试。
      # 只留 ubuntu + stable 一行做全特性冒烟(其余平台/工具链受 ort-sys 下载与
      # MSRV 限制,不做全特性门禁)。
      - name: Test all features (ubuntu+stable only)
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo test --all-features --verbose
        env:
          OPENAI_API_KEY: test-key

  # ==================== MSRV 检查 ====================
  # MSRV = 1.85(见 rust-toolchain.toml 与各 crate 的 rust-version 字段)。
  # 已由上面 test 矩阵的 `rust: "1.85"` 行(ubuntu-latest)覆盖:该行即 MSRV 门禁,
  # 保证 1.85 下默认特性编译 + 测试通过。不另起 job,避免 1.85 重复编译。
  # 注意:test job 的 RUSTUP_TOOLCHAIN=${{ matrix.rust }} 让每行用自己声明的
  # 工具链(否则 rust-toolchain.toml 会把所有行拽到 1.85);MSRV 行跳过
  # 「Test all features」步骤(feature 门控依赖需更高 rustc)。

  # ==================== semver 检查 ====================
  # 对比每个 crate 与 crates.io 最新稳定版(动态解析,即上一发布版本)的公开
  # API 差异。0.x 序列里 minor 允许破坏性变更;本门禁确保破坏都在计划内、
  # 非预期的破坏(baseline 分析结果)会以编译错误的形式暴露出来。
  semver:
    name: SemVer Checks
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      # 基线动态取 crates.io 上 facade crate(langchainrust)最新稳定版 = 上一发布
      # 版本(0.22.5 前硬编码 0.19.0,停更多个版本导致基线失真、job 长期红)。
      # 发版后同版本基线无 diff 自动通过;发版前的 push 比对的正是上一版 API。
      - name: Resolve semver baseline from crates.io
        id: baseline
        run: |
          BASELINE=$(curl -fsS https://index.crates.io/la/ng/langchainrust | python3 -c 'import json,sys; rows=[json.loads(l) for l in sys.stdin if l.strip()]; v=[r["vers"] for r in rows if not r.get("yanked") and "-" not in r["vers"]]; print(v[-1] if v else "")')
          if [ -z "$BASELINE" ]; then
            echo "ERROR: 无法从 crates.io 解析 semver 基线版本" >&2
            exit 1
          fi
          echo "semver baseline(上一发布版本)= $BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_OUTPUT"

      - name: Run semver checks
        run: cargo semver-checks --workspace --baseline-version ${{ steps.baseline.outputs.BASELINE }}

  # ==================== WASM 兼容检查 ====================
  # 目前只有数据模型层(lc-shared / lc-schema)对 wasm32-unknown-unknown 干净
  # (依赖仅 serde/serde_json/thiserror/async-trait)。lc-core 等含无条件原生依赖
  # (tokio full / reqwest / tiktoken-rs / uuid-v4→getrandom),wasm 适配未落地,
  # 详见 docs/internal/v0.16.0/EXECUTION_PLAN.md 验证清单的 wasm 项说明。
  wasm:
    name: WASM Check
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # wasm32 target 装在 stable 上,切到 1.85 会 E0463
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check wasm compatibility
        run: cargo check --target wasm32-unknown-unknown -p lc-schema -p lc-shared

  # ==================== 文档检查 ====================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 默认特性 rustdoc(MSRV 盲区之外的门控依赖不在内)。
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # 全特性 rustdoc:与 cd.yml release-gate --all-features 对齐,每次 push
      # 兜底 feature 门控 API 的文档(0.22.5 修过 fastembed all-features rustdoc E0308)。
      - name: Build documentation (all features)
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # ==================== 安全审计 ====================
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-audit 自身要求 rustc ≥ 1.88
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # ==================== 危险模式静态扫描 ====================
  # 0.18.1 ⏳ 待办落地:门禁补「安全/质量静态分析 job」。
  # scripts/security-scan.sh 用正则基线扫危险模式(SQL 拼接/路径穿越/子进程
  # 参数拼接/硬编码 key/URL 内嵌 secret)。BLOCK 命中即 fail(基线已清零,
  # 新命中即回归);A1/A4 为 ADVISORY 只打印。纯 grep 无 cargo 依赖,不受
  # windows-gnu/ort-sys 等本地环境盲区影响。
  security-scan:
    name: Security Pattern Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dangerous-pattern scan
        run: bash scripts/security-scan.sh --fail-if-found

  # ==================== 覆盖率报告 ====================
  # 使用 cargo-llvm-cov 测量行覆盖率。门禁先压到 50% 求绿:CI 日志在
  # --lcov 模式下不打印真实百分比,GitHub API/codecov 本地均无法取数,
  # 80% 是未经验证的虚高目标(一直红)。50% 作为保守基线守住,后续拿到
  # 真实覆盖率再按 baseline+margin 提回。
  # 注意:本机 windows-gnu 工具链缺 profiler_builtins(`rustc -C instrument-coverage`
  # 报 E0463),无法本地测量覆盖率;此门禁依赖 Linux CI 的完整工具链执行。
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable  # cargo-llvm-cov 自身要求 rustc ≥ 1.87
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Pre-build stdio interop fixtures
        # cargo-llvm-cov 以 `--tests` 跑用例且使用独立 target 目录,不会构建
        # examples;lc-mcp/tests/stdio_interop.rs 在 target/debug/examples 下
        # 预置二进制,缺失时 10 个用例全部 panic。
        run: cargo build -p lc-mcp --examples

      - name: Generate coverage
        run: cargo llvm-cov --workspace --fail-under-lines 50 --lcov --output-path lcov.info
        env:
          OPENAI_API_KEY: test-key

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
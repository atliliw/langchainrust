[package]
name = "langchainrust"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A LangChain-inspired framework for building LLM applications in Rust. Supports OpenAI, Agents, Tools, Memory, Chains, and RAG."
repository = "https://github.com/atliliw/langchainrust"
homepage = "https://github.com/atliliw/langchainrust"
documentation = "https://docs.rs/langchainrust"
readme = "README.md"
keywords = ["llm", "langchain", "ai", "rust", "openai"]
categories = ["algorithms", "asynchronous", "api-bindings", "science"]
authors = ["atliliw"]
exclude = [
    "/tests",
    "/docs",
    "/examples",
    "/.github",
    "/langchain",
]

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
regex = "1"
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
experimental = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Basic examples
[[example]]
name = "hello_llm"
path = "examples/basic/hello_llm.rs"

[[example]]
name = "streaming"
path = "examples/basic/streaming.rs"

[[example]]
name = "prompt_template"
path = "examples/basic/prompt_template.rs"

[[example]]
name = "tools"
path = "examples/basic/tools.rs"

# Intermediate examples
[[example]]
name = "agent_with_tools"
path = "examples/intermediate/agent_with_tools.rs"

[[example]]
name = "memory_conversation"
path = "examples/intermediate/memory_conversation.rs"

[[example]]
name = "chain_pipeline"
path = "examples/intermediate/chain_pipeline.rs"

# Advanced examples
[[example]]
name = "rag_demo"
path = "examples/advanced/rag_demo.rs"

[[example]]
name = "multi_tool_agent"
path = "examples/advanced/multi_tool_agent.rs"

[[example]]
name = "full_pipeline"
path = "examples/advanced/full_pipeline.rs"
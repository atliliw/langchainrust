[package]
name = "langchainrust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A LangChain-inspired framework for building LLM applications in Rust."
repository = "https://github.com/atliliw/langchainrust"
homepage = "https://github.com/atliliw/langchainrust"
keywords = ["llm", "langchain", "ai", "rust"]
categories = ["algorithms", "asynchronous"]

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1.89"
regex = "1.12.2"
uuid = { version = "1.10", features = ["v4"] }
futures-util = "0.3"

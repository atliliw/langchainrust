[package]
name = "langchainrust"
version = "0.5.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A LangChain-inspired framework for building LLM applications in Rust. Supports OpenAI, Agents, Tools, Memory, Chains, RAG, BM25, Hybrid Retrieval, LangGraph, HyDE, Reranking, MultiQuery, and native Function Calling."
repository = "https://github.com/atliliw/langchainrust"
homepage = "https://github.com/atliliw/langchainrust"
documentation = "https://docs.rs/langchainrust"
readme = "README.md"
keywords = ["llm", "langchain", "ai", "rag", "agent"]
categories = ["algorithms", "asynchronous", "api-bindings", "science"]
rust-version = "1.82"
authors = ["atliliw"]
exclude = [
    "/docs",
    "/.github",
    "/langchain",
    "/demo",
    "/CONTRIBUTING.md",
]

[dependencies]
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
regex = "1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
qdrant-client = { version = "1.7", optional = true }
mongodb = { version = "2.8", optional = true }
redis = { version = "0.25", optional = true, features = ["tokio-comp"] }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
# PGVector 需 sqlx + pgvector,因 libsqlite3-sys 与 rusqlite 冲突且需网络下载,
# 暂不启用。pgvector.rs 代码已写好(feature gate),用户可自行配置依赖。
pdf-extract = "0.7"
csv = "1.3"
bincode = "1.3"
tiktoken-rs = "0.5"
opentelemetry = { version = "0.27", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.17", optional = true }
zip = "2"
url = "2"
log = "0.4"
urlencoding = "2"
meval = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
wiremock = "0.6"
criterion = "0.5"

[features]
default = []
experimental = []
qdrant-integration = ["qdrant-client"]
mongodb-persistence = ["mongodb"]
redis-storage = ["redis"]
sqlite-storage = ["rusqlite"]
pgvector-storage = []  # 需用户自行配置 sqlx/pgvector 依赖(见 src/vector_stores/pgvector.rs)
opentelemetry = ["dep:opentelemetry"]
local-embeddings = ["ort", "ndarray"]
native-computer = []
sandbox-e2b = []
sandbox-wasm = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


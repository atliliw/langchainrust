[package]
name = "langchainrust"
version = "0.2.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A LangChain-inspired framework for building LLM applications in Rust. Supports OpenAI, Agents, Tools, Memory, Chains, RAG, and native Function Calling."
repository = "https://github.com/atliliw/langchainrust"
homepage = "https://github.com/atliliw/langchainrust"
documentation = "https://docs.rs/langchainrust"
readme = "README.md"
keywords = ["llm", "langchain", "ai", "rust", "agent"]
categories = ["algorithms", "asynchronous", "api-bindings", "science"]
authors = ["atliliw"]
exclude = [
    "/docs",
    "/.github",
    "/langchain",
]

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
regex = "1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
qdrant-client = { version = "1.7", optional = true }
pdf-extract = "0.7"
csv = "1.3"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

[features]
default = []
experimental = []
qdrant-integration = ["qdrant-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


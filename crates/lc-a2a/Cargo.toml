[package]
name = "lc-a2a"
version = "0.15.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A2A (Agent-to-Agent) protocol support for langchainrust — client, server, and protocol types."
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-chains = { path = "../lc-chains", version = "0.15.0" }
lc-agents = { path = "../lc-agents", version = "0.15.0" }
async-trait = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
axum = { version = "0.7", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

[features]
default = []
# Out-of-the-box axum HTTP serving (P1-7): `A2AServer::serve`.
axum = ["dep:axum", "dep:tower-http", "dep:tokio-stream"]


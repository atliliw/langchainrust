[package]
name = "lc-agents"
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Agent system for langchainrust — ReAct, FunctionCalling, PlanExecute, CRAG, AdaptiveRAG, DeepResearch, Handoffs, Streaming"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core" }
lc-schema = { path = "../lc-schema" }
lc-shared = { path = "../lc-shared" }
lc-callbacks = { path = "../lc-callbacks" }
lc-memory = { path = "../lc-memory" }
lc-rag = { path = "../lc-rag" }
lc-providers = { path = "../lc-providers" }
lc-tools = { path = "../lc-tools" }
lc-embeddings = { path = "../lc-embeddings" }
lc-vector-stores = { path = "../lc-vector-stores" }
lc-prompts = { path = "../lc-prompts" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
thiserror = "2.0"
schemars = "0.8"
regex = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

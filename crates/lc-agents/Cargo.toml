[package]
name = "lc-agents"
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Agent system for langchainrust — ReAct, FunctionCalling, PlanExecute, CRAG, AdaptiveRAG, DeepResearch, Handoffs, Streaming"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core", version = "0.12.0" }
lc-schema = { path = "../lc-schema", version = "0.12.0" }
lc-shared = { path = "../lc-shared", version = "0.12.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.12.0" }
lc-memory = { path = "../lc-memory", version = "0.12.0" }
lc-rag = { path = "../lc-rag", version = "0.12.0" }
lc-providers = { path = "../lc-providers", version = "0.12.0" }
lc-tools = { path = "../lc-tools", version = "0.12.0" }
lc-embeddings = { path = "../lc-embeddings", version = "0.12.0" }
lc-vector-stores = { path = "../lc-vector-stores", version = "0.12.0" }
lc-prompts = { path = "../lc-prompts", version = "0.12.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
thiserror = "2.0"
schemars = "0.8"
regex = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

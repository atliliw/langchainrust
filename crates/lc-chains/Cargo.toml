[package]
name = "lc-chains"
version = "0.20.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Chain compositions for langchainrust — LLMChain, SequentialChain, RetrievalQA, etc."
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core", version = "0.20.0" }
lc-schema = { path = "../lc-schema", version = "0.20.0" }
lc-shared = { path = "../lc-shared", version = "0.20.0" }
lc-memory = { path = "../lc-memory", version = "0.20.0" }
lc-rag = { path = "../lc-rag", version = "0.20.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.20.0" }
lc-providers = { path = "../lc-providers", version = "0.20.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
thiserror = "2.0"
regex = "1"
log = "0.4"

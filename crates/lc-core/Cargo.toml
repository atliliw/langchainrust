[package]
name = "lc-core"
version = "0.25.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core abstractions for langchainrust — Runnable, BaseTool, BaseChatModel, etc."
repository = "https://github.com/atliliw/langchainrust"
rust-version.workspace = true

[dependencies]
lc-shared = { path = "../lc-shared", version = "0.25.0" }
lc-schema = { path = "../lc-schema", version = "0.25.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.25.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures-util = "0.3"
async-stream = "0.3"
log = "0.4"
schemars = "1.0"
uuid = { version = "1.10", features = ["v4"] }

# Native-only dependencies (not available on WASM)
tokio = { version = "1.0", features = ["full"] }
tiktoken-rs = { version = "0.5" }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
# SSE byte streams surface reqwest's `bytes::Bytes`; declare directly rather
# than relying on a transitive re-export.
bytes = "1"
url = "2"
# Minimal crate for parsing Retry-After IMF-fixdate values in the unified HTTP client.
httpdate = "1"

[dev-dependencies]
# start_paused = true needs test-util; dev-only so lib builds stay feature-free.
tokio = { version = "1.0", features = ["full", "test-util"] }

[features]
default = []
wasm = []

[package.metadata.docs.rs]
all-features = true

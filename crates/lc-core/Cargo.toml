[package]
name = "lc-core"
version = "0.18.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core abstractions for langchainrust — Runnable, BaseTool, BaseChatModel, etc."
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-shared = { path = "../lc-shared", version = "0.18.0" }
lc-schema = { path = "../lc-schema", version = "0.18.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.18.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures-util = "0.3"
async-stream = "0.3"
log = "0.4"
schemars = "0.8"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4" }
regex = "1"

# Native-only dependencies (not available on WASM)
tokio = { version = "1.0", features = ["full"] }
tiktoken-rs = { version = "0.5" }
reqwest = { version = "0.12", features = ["json", "multipart"] }

[features]
default = []
wasm = []

[package.metadata.docs.rs]
all-features = true

[package]
name = "lc-core"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Core abstractions for langchainrust — Runnable, BaseTool, BaseChatModel, etc."
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-shared = { path = "../lc-shared", version = "0.9.0" }
lc-schema = { path = "../lc-schema", version = "0.9.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.9.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
futures-util = "0.3"
tiktoken-rs = "0.5"
schemars = "0.8"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4" }
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }

[package]
name = "lc-embeddings"
version = "0.24.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Embedding model implementations for langchainrust — OpenAI, DeepSeek, Qwen, local/ONNX"
repository = "https://github.com/atliliw/langchainrust"
rust-version.workspace = true

[dependencies]
lc-core = { path = "../lc-core", version = "0.24.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2.0"
futures-util = "0.3"
log = "0.4"
trait-variant = "0.1"
ort = { version = "2.0.0-rc.13", optional = true }
ndarray = { version = "0.17", optional = true }
fastembed = { version = "5", optional = true }
tokenizers = { version = "0.22", optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
candle-transformers = { version = "0.11.0", optional = true }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

[features]
default = []
# MSRV 分层(T3,v0.23):以下三个本地模型 feature 的门控依赖(ort-sys 2.0 /
# candle / tokenizers)实际要求 rustc ≥ 1.88,高于工作区默认特性 MSRV 1.85。
# Cargo 只支持 per-package rust-version、不支持 per-feature,故此处不能声明,
# 以 facade README「Rust version requirements」与 CI 分层(默认特性跑 1.85,
# feature 组合由 stable 的 cargo-hack/clippy-all-features job 覆盖)兜底。
local-embeddings = ["ort", "ndarray", "dep:tokenizers"]
fastembed = ["dep:fastembed"]
local-candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
]

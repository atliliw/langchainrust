[package]
name = "lc-evaluation"
version = "0.9.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Evaluation framework for langchainrust — Evaluator trait, built-in evaluators, dataset runner"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core", version = "0.9.0" }
lc-schema = { path = "../lc-schema", version = "0.9.0" }
lc-embeddings = { path = "../lc-embeddings", version = "0.9.0" }
lc-providers = { path = "../lc-providers", version = "0.9.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
futures-util = "0.3"
regex = "1"

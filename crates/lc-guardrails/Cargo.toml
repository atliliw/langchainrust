[package]
name = "lc-guardrails"
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Guardrails for langchainrust — input/output safety validation for agents"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-agents = { path = "../lc-agents", version = "0.12.0" }
lc-core = { path = "../lc-core", version = "0.12.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
regex = "1"

[dev-dependencies]
lc-providers = { path = "../lc-providers", version = "0.12.0" }

[package]
name = "lc-langgraph"
version = "0.12.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LangGraph - Graph-based orchestration framework for building stateful LLM applications"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
futures-util = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3.0"

[features]
default = []
mongodb-persistence = ["mongodb"]

[dependencies.mongodb]
version = "2.8"
optional = true

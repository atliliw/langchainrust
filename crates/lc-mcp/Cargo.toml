[package]
name = "lc-mcp"
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP (Model Context Protocol) client for langchainrust"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core", version = "0.11.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

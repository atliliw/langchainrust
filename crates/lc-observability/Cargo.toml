[package]
name = "lc-observability"
version = "0.27.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pluggable observability sinks for langchainrust — JSON-lines file, MongoDB."
repository = "https://github.com/atliliw/langchainrust"
rust-version.workspace = true

[dependencies]
lc-core = { path = "../lc-core", version = "0.27.0" }
async-trait = "0.1"
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-util", "sync", "rt"] }

# Optional: MongoDB sink (feature `mongodb`).
mongodb = { version = "2.8", optional = true }

# Optional: OTLP sink (feature `otlp`). Versions/features mirror `lc-callbacks`
# exactly so the locked 0.27 SDK does not drift across the workspace.
# The `metrics` feature enables the `gen_ai.client.token.usage` Meter pipeline
# (T2: cost-aggregation KPI for Prometheus/OTLP collection).
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, optional = true, features = ["trace", "metrics", "http-json", "reqwest-client"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# In-memory span exporter lets the OTLP mapping tests run offline (no collector).
[dev-dependencies.opentelemetry_sdk]
version = "0.27"
features = ["trace", "testing", "rt-tokio"]

[features]
default = ["jsonl"]
jsonl = []
mongodb = ["dep:mongodb"]
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[package.metadata.docs.rs]
all-features = true

[package]
name = "lc-observability"
version = "0.22.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pluggable observability sinks for langchainrust — JSON-lines file, MongoDB."
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.85"

[dependencies]
lc-core = { path = "../lc-core", version = "0.22.0" }
async-trait = "0.1"
serde_json = "1.0"
log = "0.4"
tokio = { version = "1.0", features = ["fs", "io-util", "sync"] }
futures-util = "0.3"

# Optional: MongoDB sink (feature `mongodb`).
mongodb = { version = "2.8", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[features]
default = ["jsonl"]
jsonl = []
mongodb = ["dep:mongodb"]

[package.metadata.docs.rs]
all-features = true

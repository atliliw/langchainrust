[package]
name = "lc-prompts"
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prompt templates for langchainrust"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-schema = { path = "../lc-schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

[package]
name = "lc-prompts"
version = "0.25.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prompt templates for langchainrust"
repository = "https://github.com/atliliw/langchainrust"
rust-version.workspace = true

[dependencies]
lc-schema = { path = "../lc-schema", version = "0.25.0" }
lc-core = { path = "../lc-core", version = "0.25.0" }
async-trait = "0.1"
sha2 = "0.10"
thiserror = "2.0"

[features]
default = []
wasm = []

[dev-dependencies]
# Runnable 形态测试需要异步运行时(不影响 lib / wasm 构建)
tokio = { version = "1.0", features = ["full"] }

[package.metadata.docs.rs]
all-features = true

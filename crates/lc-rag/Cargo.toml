[package]
name = "lc-rag"
version = "0.20.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RAG (Retrieval-Augmented Generation) module for langchainrust — BM25, Hybrid Retrieval, GraphRAG, HyDE, Reranking, MultiQuery, Document Loaders"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.85"

[dependencies]
lc-shared = { path = "../lc-shared", version = "0.20.0" }
lc-core = { path = "../lc-core", version = "0.20.0" }
lc-schema = { path = "../lc-schema", version = "0.20.0" }
lc-embeddings = { path = "../lc-embeddings", version = "0.20.0" }
lc-vector-stores = { path = "../lc-vector-stores", version = "0.20.0" }
lc-prompts = { path = "../lc-prompts", version = "0.20.0" }
lc-providers = { path = "../lc-providers", version = "0.20.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
log = "0.4"
bincode = "1.3"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
csv = "1.3"
fnv = "1"
pdf-extract = "0.7"
zip = "2"

[dev-dependencies]
futures-util = "0.3"
tokio-test = "0.4"
tempfile = "3.0"

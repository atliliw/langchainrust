[package]
name = "lc-sessions"
version = "0.18.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Session management for langchainrust"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.82"

[dependencies]
lc-core = { path = "../lc-core", version = "0.18.0" }
lc-schema = { path = "../lc-schema", version = "0.18.0" }
lc-memory = { path = "../lc-memory", version = "0.18.0" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }

[dev-dependencies]
futures-util = "0.3"

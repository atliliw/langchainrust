[package]
name = "lc-testkit"
version = "0.22.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Testing harness for langchainrust — record real LLM exchanges and replay them offline"
repository = "https://github.com/atliliw/langchainrust"
rust-version = "1.85"

[dependencies]
lc-core = { path = "../lc-core", version = "0.22.1" }
lc-schema = { path = "../lc-schema", version = "0.22.1" }
lc-providers = { path = "../lc-providers", version = "0.22.1" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
lc-chains = { path = "../lc-chains", version = "0.22.1" }
lc-agents = { path = "../lc-agents", version = "0.22.1" }
lc-tools = { path = "../lc-tools", version = "0.22.1" }
lc-memory = { path = "../lc-memory", version = "0.22.1" }
lc-rag = { path = "../lc-rag", version = "0.22.1" }
lc-vector-stores = { path = "../lc-vector-stores", version = "0.22.1" }
lc-embeddings = { path = "../lc-embeddings", version = "0.22.1" }
lc-callbacks = { path = "../lc-callbacks", version = "0.22.1" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

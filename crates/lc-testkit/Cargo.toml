[package]
name = "lc-testkit"
version = "0.25.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Testing harness for langchainrust — record real LLM exchanges and replay them offline"
repository = "https://github.com/atliliw/langchainrust"
rust-version.workspace = true

[dependencies]
lc-core = { path = "../lc-core", version = "0.25.0" }
lc-schema = { path = "../lc-schema", version = "0.25.0" }
lc-providers = { path = "../lc-providers", version = "0.25.0" }
# N2 (v0.24.0): traces sink into lc-evaluation golden datasets and a replay-backed
# Predictor, closing the record → golden → score regression loop in one crate.
lc-evaluation = { path = "../lc-evaluation", version = "0.25.0" }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
# `wire`: reusable loopback HTTP/1.1 mock server (T1, v0.25.0) for wire-level
# replay in the embeddings / vector-stores / rag test suites. Off by default so
# the pure record/replay core stays dependency-light; enabled only by consumer
# `[dev-dependencies]`. lc-providers keeps its own copy (dev-dep cycle), so this
# server's real consumers are the other crate test suites.
tokio = { version = "1.0", features = ["net", "io-util"], optional = true }

[features]
default = []
# The `wire` loopback mock server + its tokio runtime dependency.
wire = ["dep:tokio"]

[dev-dependencies]
lc-chains = { path = "../lc-chains", version = "0.25.0" }
lc-agents = { path = "../lc-agents", version = "0.25.0" }
lc-tools = { path = "../lc-tools", version = "0.25.0" }
lc-memory = { path = "../lc-memory", version = "0.25.0" }
lc-rag = { path = "../lc-rag", version = "0.25.0" }
lc-vector-stores = { path = "../lc-vector-stores", version = "0.25.0" }
lc-embeddings = { path = "../lc-embeddings", version = "0.25.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.25.0" }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

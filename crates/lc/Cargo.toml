[package]
name = "langchainrust"
version = "0.18.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A LangChain-inspired framework for building LLM applications in Rust. Supports OpenAI, Agents, Tools, Memory, Chains, RAG, BM25, Hybrid Retrieval, LangGraph, HyDE, Reranking, MultiQuery, and native Function Calling."
repository = "https://github.com/atliliw/langchainrust"
homepage = "https://github.com/atliliw/langchainrust"
documentation = "https://docs.rs/langchainrust"
readme = "README.md"
keywords = ["llm", "langchain", "ai", "rag", "agent"]
categories = ["algorithms", "asynchronous", "api-bindings", "science"]
rust-version = "1.82"
authors = ["atliliw"]
exclude = [
    "/docs",
    "/.github",
    "/langchain",
    "/demo",
    "/CONTRIBUTING.md",
]

[dependencies]
lc-shared = { path = "../lc-shared", version = "0.18.0" }
lc-schema = { path = "../lc-schema", version = "0.18.0" }
lc-callbacks = { path = "../lc-callbacks", version = "0.18.0" }
lc-core = { path = "../lc-core", version = "0.18.0" }
lc-prompts = { path = "../lc-prompts", version = "0.18.0" }
lc-langgraph = { path = "../lc-langgraph", version = "0.18.0" }
lc-sessions = { path = "../lc-sessions", version = "0.18.0" }
lc-mcp = { path = "../lc-mcp", version = "0.18.0" }
lc-providers = { path = "../lc-providers", version = "0.18.0" }
lc-tools = { path = "../lc-tools", version = "0.18.0" }
lc-embeddings = { path = "../lc-embeddings", version = "0.18.0" }
lc-vector-stores = { path = "../lc-vector-stores", version = "0.18.0" }
lc-rag = { path = "../lc-rag", version = "0.18.0" }
lc-memory = { path = "../lc-memory", version = "0.18.0" }
lc-chains = { path = "../lc-chains", version = "0.18.0" }
lc-agents = { path = "../lc-agents", version = "0.18.0" }
lc-evaluation = { path = "../lc-evaluation", version = "0.18.0" }
lc-guardrails = { path = "../lc-guardrails", version = "0.18.0" }
lc-a2a = { path = "../lc-a2a", version = "0.18.0" }
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
regex = "1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
futures-util = "0.3"
schemars = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
qdrant-client = { version = "1.7", optional = true }
mongodb = { version = "2.8", optional = true }
redis = { version = "0.25", optional = true, features = ["tokio-comp"] }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
# PGVector(可选):依赖由 lc-vector-stores 的 pgvector-storage feature 拉入。
# 选用 sqlx 0.8 —— 与 rusqlite 0.31 共享 libsqlite3-sys 0.28,无 links 冲突;
# 不可升 sqlx 0.8.6+(改拉 libsqlite3-sys 0.31)或 0.9(需 Rust 1.94)。
# 开启方式:cargo build --features pgvector-storage
pdf-extract = "0.7"
csv = "1.3"
bincode = "1.3"
tiktoken-rs = "0.5"
opentelemetry = { version = "0.27", optional = true }
zip = "2"
url = "2"
log = "0.4"
urlencoding = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
wiremock = "0.6"
criterion = "0.5"
# 只为测试/示例启用 lc-a2a 的 axum 服务器(serve/serve_on),不拖累下游 lib 用户
lc-a2a = { path = "../lc-a2a", version = "0.18.0", features = ["axum"] }

[features]
default = []
experimental = []
qdrant-integration = ["qdrant-client", "lc-vector-stores/qdrant-integration"]
mongodb-persistence = ["mongodb", "lc-memory/mongodb-persistence", "lc-vector-stores/mongodb-persistence", "lc-langgraph/mongodb-persistence"]
redis-storage = ["redis", "lc-vector-stores/redis-storage"]
sqlite-storage = ["rusqlite", "lc-vector-stores/sqlite-storage"]
pgvector-storage = ["lc-vector-stores/pgvector-storage"]
opentelemetry = ["dep:opentelemetry", "lc-callbacks/opentelemetry"]
local-embeddings = ["lc-embeddings/local-embeddings"]
fastembed = ["lc-embeddings/fastembed"]
vectorstore-memory = ["lc-memory/vectorstore-memory"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


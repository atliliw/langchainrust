[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchainrust"
version = "0.31.0"
description = "Thin Python client for the langchainrust OpenAI-compatible server"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchainrust*"]
